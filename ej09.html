<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 9 | Galería</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--primary:#7c3aed;--secondary:#06b6d4;--accent:#f59e0b;--white:#fff;--line:rgba(148,163,184,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0b1020,#111827 55%,#172554);color:var(--text);line-height:1.6;min-height:100vh}
a{color:#93c5fd}.container{width:min(1100px,92%);margin:auto}.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}.brand{font-weight:800;color:white;text-decoration:none;letter-spacing:.3px}.navlinks{display:flex;gap:10px;flex-wrap:wrap}.navlinks a{color:#dbeafe;text-decoration:none;padding:8px 12px;border-radius:10px}.navlinks a:hover,.navlinks a:focus{background:#273449;color:#fff}.hero{padding:70px 0 44px}.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center}.eyebrow{display:inline-block;padding:6px 10px;border:1px solid rgba(124,58,237,.55);background:rgba(124,58,237,.12);border-radius:999px;color:#c4b5fd;font-size:.88rem;font-weight:700}.hero h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.02;margin:16px 0}.gradient-text{background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;color:transparent}.hero p{color:#cbd5e1;max-width:720px;font-size:1.05rem}.card{background:linear-gradient(180deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.section{padding:34px 0}.section h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.exercise-card{display:block;text-decoration:none;color:inherit;min-height:160px;transition:.2s transform,.2s border-color}.exercise-card:hover{transform:translateY(-4px);border-color:rgba(103,232,249,.5)}.number{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#0891b2);font-weight:800;color:white;margin-bottom:12px}.exercise-card h3{margin:4px 0 8px}.muted{color:var(--muted)}.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;text-decoration:none;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#243146}.back{margin-top:22px}.content{padding:44px 0 64px}.content h1{font-size:clamp(2rem,5vw,3.3rem);margin-bottom:8px}.demo{margin-top:22px}.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#111827}th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}th{background:#1e293b;color:#c4b5fd}tr:last-child td{border-bottom:0}input,textarea,select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.18)}label{display:block;margin:12px 0 6px;font-weight:700}.notice{padding:14px 16px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);border-radius:12px;color:#bbf7d0}.footer{border-top:1px solid var(--line);padding:24px 0 34px;color:#94a3b8;text-align:center}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;background:rgba(255,255,255,.03)}
@media(max-width:820px){.hero-grid,.grid{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.hero{padding-top:44px}}
@media(max-width:520px){.container{width:min(94%,1100px)}.card{padding:18px}.navlinks a{padding:7px 8px}.hero h1{font-size:2.35rem}}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.gallery button{padding:0;border:1px solid var(--line);background:#111827;border-radius:18px;overflow:hidden;cursor:pointer;color:white;text-align:left}.gallery img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.gallery span{display:block;padding:12px 14px;font-weight:700}.modal{display:none;position:fixed;inset:0;background:rgba(2,6,23,.9);z-index:50;padding:24px;place-items:center}.modal.open{display:grid}.modal-content{width:min(900px,96%);background:#0f172a;border:1px solid var(--line);border-radius:18px;overflow:hidden}.modal img{width:100%;display:block}.modal-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.close{border:0;background:#243146;color:white;border-radius:10px;padding:9px 12px;cursor:pointer}@media(max-width:760px){.gallery{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html">Wilmer Jose Lopez Ponce</a><nav class="navlinks"><a href="index.html">Inicio</a><a href="ej05.html">Biografía</a><a href="ej07.html">Navegación</a><a href="ej09.html">Galería</a><a href="ej10.html">Página completa</a></nav></div></header>
<main class="content"><div class="container"><span class="eyebrow">Ejercicio 9</span><h1>Galería de pasatiempos</h1><p class="muted">Haz clic en una imagen para verla en una ventana emergente.</p><div class="gallery demo"><button type="button" data-img="img/programacion.svg" data-title="Programación"><img src="img/programacion.svg" alt="Ilustración de programación"><span>Programación</span></button><button type="button" data-img="img/videojuegos.svg" data-title="Videojuegos"><img src="img/videojuegos.svg" alt="Ilustración de videojuegos"><span>Videojuegos</span></button><button type="button" data-img="img/musica.svg" data-title="Música"><img src="img/musica.svg" alt="Ilustración de música"><span>Música</span></button></div><a class="btn secondary back" href="index.html">← Volver al inicio</a></div></main><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Imagen ampliada"><div class="modal-content"><img id="modalImg" src="" alt=""><div class="modal-bar"><strong id="modalTitle"></strong><button id="cerrar" class="close" type="button">Cerrar</button></div></div></div>
<footer class="footer"><div class="container">Programación Web Avanzada · Tarea Práctica 1 · Wilmer Jose Lopez Ponce</div></footer>
<script>const modal=document.getElementById('modal'),mi=document.getElementById('modalImg'),mt=document.getElementById('modalTitle');document.querySelectorAll('.gallery button').forEach(b=>b.addEventListener('click',()=>{mi.src=b.dataset.img;mi.alt='Vista ampliada de '+b.dataset.title;mt.textContent=b.dataset.title;modal.classList.add('open');}));document.getElementById('cerrar').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});</script>
</body></html>
